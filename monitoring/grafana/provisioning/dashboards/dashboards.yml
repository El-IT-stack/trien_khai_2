# ==============================================================================
# GRAFANA DASHBOARDS PROVISIONING
# ==============================================================================

apiVersion: 1

providers:
  - name: 'CineEvent Monitoring Dashboards'
    orgId: 1
    folder: 'CineEvent'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
