<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Sách Phim Chiếu Rạp — CineEvent</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/index.html">
        <i class="bi bi-film text-danger fs-3"></i>
        <span>Cine<span class="brand-badge">Event</span></span>
      </a>

      <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <i class="bi bi-list fs-2"></i>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-house-door me-1"></i> Trang Chủ</a></li>
          <li class="nav-item"><a class="nav-link active" href="/movies.html"><i class="bi bi-camera-reels me-1"></i> Phim Chiếu Rạp</a></li>
          <li class="nav-item"><a class="nav-link" href="/events.html"><i class="bi bi-calendar-event me-1"></i> Sự Kiện & Lễ Hội</a></li>
          <li class="nav-item"><a class="nav-link" href="/my-tickets.html"><i class="bi bi-ticket-perforated me-1"></i> Vé Của Tôi</a></li>
        </ul>
        <div id="navbarAuthSection" class="d-flex align-items-center"></div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-5">
    <!-- Header & Search Filters -->
    <div class="glass-card p-4 mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-5">
          <h3 class="fw-bold text-white mb-1"><i class="bi bi-camera-reels text-danger me-2"></i>Khám Phá Phim Chiếu Rạp</h3>
          <p class="text-muted small mb-0">Cập nhật lịch chiếu phim chiếu rạp mới nhất tại CineEvent</p>
        </div>
        <div class="col-md-7">
          <div class="row g-2">
            <div class="col-sm-6">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search text-danger"></i></span>
                <input type="text" id="movieSearchInput" class="form-control" placeholder="Tìm tên phim, diễn viên...">
              </div>
            </div>
            <div class="col-sm-6">
              <select id="genreFilterSelect" class="form-select">
                <option value="">Tất cả thể loại</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab Buttons -->
      <div class="d-flex gap-2 mt-4 pt-3 border-top border-secondary">
        <button class="btn btn-primary-cine btn-sm px-4" id="btnFilterAll" onclick="setTab('')">Tất Cả</button>
        <button class="btn btn-outline-cine btn-sm px-4" id="btnFilterNow" onclick="setTab('now_showing')">Phim Đang Chiếu</button>
        <button class="btn btn-outline-cine btn-sm px-4" id="btnFilterComing" onclick="setTab('coming_soon')">Phim Sắp Chiếu</button>
      </div>
    </div>

    <!-- Movie Grid -->
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4" id="moviesContainer">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-danger" role="status"></div>
        <div class="text-muted mt-2">Đang tải danh sách phim...</div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto py-4 border-top border-secondary" style="background: #070a10;">
    <div class="container text-center text-muted small">
      CineEvent — Hệ Thống Đặt Vé Xem Phim & Sự Kiện | Sinh viên: [HỌ VÀ TÊN] - MSSV: [MSSV] - Lớp: [LỚP]
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=2"></script>
  <script>
    let currentStatus = '';
    let currentGenre = '';
    let currentSearch = '';

    function setTab(status) {
      currentStatus = status;
      document.getElementById('btnFilterAll').className = status === '' ? 'btn btn-primary-cine btn-sm px-4' : 'btn btn-outline-cine btn-sm px-4';
      document.getElementById('btnFilterNow').className = status === 'now_showing' ? 'btn btn-primary-cine btn-sm px-4' : 'btn btn-outline-cine btn-sm px-4';
      document.getElementById('btnFilterComing').className = status === 'coming_soon' ? 'btn btn-primary-cine btn-sm px-4' : 'btn btn-outline-cine btn-sm px-4';
      loadMovies();
    }

    async function loadGenres() {
      try {
        const res = await apiCall('/movies/genres');
        const select = document.getElementById('genreFilterSelect');
        if (res.data) {
          res.data.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g.id;
            opt.textContent = g.name;
            select.appendChild(opt);
          });
        }
      } catch (e) {}
    }

    async function loadMovies() {
      const container = document.getElementById('moviesContainer');
      container.innerHTML = `
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-danger" role="status"></div>
          <div class="text-muted mt-2">Đang tải...</div>
        </div>
      `;

      try {
        let url = `/movies?status=${currentStatus}&genre_id=${currentGenre}&search=${encodeURIComponent(currentSearch)}`;
        const res = await apiCall(url);

        if (!res.data || res.data.length === 0) {
          container.innerHTML = '<div class="col-12 text-center py-5 text-muted">Không tìm thấy phim phù hợp với tiêu chí tìm kiếm.</div>';
          return;
        }

        container.innerHTML = res.data.map(m => `
          <div class="col">
            <div class="movie-card">
              <div class="poster-wrapper">
                <span class="age-badge">${m.age_rating || 'P'}</span>
                <img src="${m.poster_url}" class="poster-img" alt="${m.title}">
              </div>
              <div class="p-3 d-flex flex-column flex-grow-1">
                <span class="badge bg-secondary mb-1 align-self-start small">${m.genre_name || 'Điện Ảnh'}</span>
                <h6 class="fw-bold text-white text-truncate mb-1" title="${m.title}">${m.title}</h6>
                <div class="text-muted small mb-2"><i class="bi bi-clock me-1"></i>${m.duration} phút</div>
                <div class="mt-auto">
                  ${m.status === 'now_showing' ? `
                    <a href="/movie-detail.html?id=${m.id}" class="btn btn-primary-cine btn-sm w-100">
                      <i class="bi bi-ticket-fill me-1"></i> Đặt Vé Ngay
                    </a>
                  ` : `
                    <a href="/movie-detail.html?id=${m.id}" class="btn btn-outline-cine btn-sm w-100">
                      <i class="bi bi-info-circle me-1"></i> Xem Chi Tiết
                    </a>
                  `}
                </div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="col-12 text-center py-5 text-danger">${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadGenres();
      loadMovies();

      document.getElementById('movieSearchInput').addEventListener('input', (e) => {
        currentSearch = e.target.value.trim();
        loadMovies();
      });

      document.getElementById('genreFilterSelect').addEventListener('change', (e) => {
        currentGenre = e.target.value;
        loadMovies();
      });
    });
  </script>
</body>
</html>
