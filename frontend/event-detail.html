<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Sự Kiện & Đặt Vé — CineEvent</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/index.html">
        <i class="bi bi-film text-danger fs-3"></i>
        <span>Cine<span class="brand-badge">Event</span></span>
      </a>

      <button class="navbar-toggler border-0 text-white" type="button" data-bs-target="#mainNavbar" data-bs-toggle="collapse">
        <i class="bi bi-list fs-2"></i>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-house-door me-1"></i> Trang Chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="/movies.html"><i class="bi bi-camera-reels me-1"></i> Phim Chiếu Rạp</a></li>
          <li class="nav-item"><a class="nav-link active" href="/events.html"><i class="bi bi-calendar-event me-1"></i> Sự Kiện & Lễ Hội</a></li>
          <li class="nav-item"><a class="nav-link" href="/my-tickets.html"><i class="bi bi-ticket-perforated me-1"></i> Vé Của Tôi</a></li>
        </ul>
        <div id="navbarAuthSection" class="d-flex align-items-center"></div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-5">
    <div id="eventDetailContent">
      <div class="text-center py-5">
        <div class="spinner-border text-warning" role="status"></div>
        <div class="text-muted mt-2">Đang tải thông tin sự kiện...</div>
      </div>
    </div>
  </main>

  <footer class="mt-auto py-4 border-top border-secondary" style="background: #070a10;">
    <div class="container text-center text-muted small">
      CineEvent — Hệ Thống Đặt Vé Xem Phim & Sự Kiện | Sinh viên: [HỌ VÀ TÊN] - MSSV: [MSSV] - Lớp: [LỚP]
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=2"></script>
  <script>
    let currentEvent = null;
    let selectedTickets = {}; // { ticket_type_id: { quantity, price, name } }

    function updateTicketQty(typeId, delta, price, name, maxAvailable) {
      if (!selectedTickets[typeId]) {
        selectedTickets[typeId] = { quantity: 0, price, name };
      }

      let newQty = selectedTickets[typeId].quantity + delta;
      if (newQty < 0) newQty = 0;
      if (newQty > maxAvailable) {
        showToast(`Loại vé này chỉ còn lại ${maxAvailable} vé!`, 'warning');
        return;
      }

      selectedTickets[typeId].quantity = newQty;
      const inputEl = document.getElementById(`qtyInput_${typeId}`);
      if (inputEl) inputEl.value = newQty;

      renderOrderSummary();
    }

    function renderOrderSummary() {
      const summaryContainer = document.getElementById('eventOrderSummary');
      const bookBtn = document.getElementById('btnSubmitEventBooking');
      if (!summaryContainer) return;

      const items = Object.entries(selectedTickets).filter(([_, item]) => item.quantity > 0);
      let total = 0;

      if (items.length === 0) {
        summaryContainer.innerHTML = '<div class="text-muted small text-center py-3">Chưa có loại vé nào được chọn.</div>';
        if (bookBtn) bookBtn.disabled = true;
        document.getElementById('eventTotalAmountDisplay').textContent = '0 ₫';
        return;
      }

      let html = '<ul class="list-unstyled mb-0">';
      items.forEach(([_, item]) => {
        const sub = item.price * item.quantity;
        total += sub;
        html += `
          <li class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary small">
            <div>
              <strong class="text-white">${item.name}</strong>
              <div class="text-muted">${formatVND(item.price)} x ${item.quantity}</div>
            </div>
            <strong class="text-warning">${formatVND(sub)}</strong>
          </li>
        `;
      });
      html += '</ul>';

      summaryContainer.innerHTML = html;
      document.getElementById('eventTotalAmountDisplay').textContent = formatVND(total);
      if (bookBtn) bookBtn.disabled = false;
    }

    async function handleEventBooking() {
      const user = getCurrentUser();
      if (!user) {
        showToast('Vui lòng đăng nhập để tiến hành đặt vé!', 'warning');
        const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
        loginModal.show();
        return;
      }

      const ticketItems = Object.entries(selectedTickets)
        .filter(([_, item]) => item.quantity > 0)
        .map(([typeId, item]) => ({
          ticket_type_id: parseInt(typeId, 10),
          quantity: item.quantity,
          unit_price: item.price
        }));

      if (ticketItems.length === 0) {
        showToast('Vui lòng chọn ít nhất 1 vé!', 'warning');
        return;
      }

      const btn = document.getElementById('btnSubmitEventBooking');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang tạo đơn hàng...';

      try {
        const res = await apiCall('/bookings', {
          method: 'POST',
          body: {
            booking_type: 'event',
            event_id: currentEvent.id,
            ticket_items: ticketItems
          }
        });

        showToast('Tạo đơn đặt vé thành công!', 'success');
        setTimeout(() => {
          window.location.href = `/payment.html?code=${res.data.bookingCode}`;
        }, 500);
      } catch (err) {
        showToast(err.message, 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-credit-card me-2"></i>Tiếp Tục Thanh Toán Giả Lập';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get('id') || '1';

      try {
        const res = await apiCall(`/events/${eventId}`);
        currentEvent = res.data;

        const ticketTypes = currentEvent.ticket_types || [];
        const ticketRowsHtml = ticketTypes.map(t => {
          const available = t.total_quantity - t.sold_quantity;
          const isSoldOut = available <= 0;
          return `
            <div class="glass-card p-3 mb-3 d-flex flex-wrap justify-content-between align-items-center gap-3">
              <div>
                <h6 class="fw-bold text-white mb-1">${t.name}</h6>
                <div class="text-muted small mb-1">${t.description || ''}</div>
                <div class="d-flex align-items-center gap-2">
                  <span class="text-warning fw-bold fs-5">${formatVND(t.price)}</span>
                  <span class="badge ${isSoldOut ? 'bg-danger' : 'bg-success'} small">
                    ${isSoldOut ? 'Hết vé' : `Còn lại: ${available} vé`}
                  </span>
                </div>
              </div>
              <div>
                ${isSoldOut ? `
                  <button class="btn btn-secondary btn-sm" disabled>Hết vé</button>
                ` : `
                  <div class="input-group" style="width: 140px;">
                    <button class="btn btn-outline-secondary text-white" type="button" onclick="updateTicketQty(${t.id}, -1, ${t.price}, '${t.name}', ${available})">-</button>
                    <input type="text" id="qtyInput_${t.id}" class="form-control text-center bg-dark text-white p-1" value="0" readonly>
                    <button class="btn btn-outline-secondary text-white" type="button" onclick="updateTicketQty(${t.id}, 1, ${t.price}, '${t.name}', ${available})">+</button>
                  </div>
                `}
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('eventDetailContent').innerHTML = `
          <!-- Header Banner -->
          <div class="glass-card overflow-hidden mb-5">
            <div style="height: 320px; position: relative;">
              <img src="${currentEvent.banner_url}" style="width:100%; height:100%; object-fit:cover;" alt="${currentEvent.title}">
              <div class="hero-overlay"></div>
              <div class="position-absolute bottom-0 start-0 p-4 p-md-5">
                <span class="badge bg-warning text-dark mb-2 px-3 py-2 fw-bold text-uppercase">${currentEvent.category}</span>
                <h1 class="display-6 fw-bold text-white mb-2">${currentEvent.title}</h1>
                <div class="d-flex flex-wrap gap-4 text-light small">
                  <div><i class="bi bi-clock text-warning me-2"></i>${formatDateTime(currentEvent.start_time)}</div>
                  <div><i class="bi bi-geo-alt text-danger me-2"></i>${currentEvent.venue_name} (${currentEvent.venue_address})</div>
                  <div><i class="bi bi-person-badge text-info me-2"></i>Đơn vị: ${currentEvent.organizer}</div>
                </div>
              </div>
            </div>
          </div>

          <div class="row g-4">
            <!-- Left: Description and Ticket Types -->
            <div class="col-lg-8">
              <div class="glass-card p-4 mb-4">
                <h4 class="fw-bold text-white mb-3"><i class="bi bi-info-circle text-danger me-2"></i>Giới Thiệu Sự Kiện</h4>
                <p class="text-light lead fs-6 mb-0">${currentEvent.description || 'Chưa có thông tin giới thiệu.'}</p>
              </div>

              <div class="glass-card p-4">
                <h4 class="fw-bold text-white mb-3"><i class="bi bi-ticket-perforated text-warning me-2"></i>Chọn Loại Vé</h4>
                ${ticketRowsHtml || '<div class="text-muted">Không có loại vé nào khả dụng.</div>'}
              </div>
            </div>

            <!-- Right: Order Summary -->
            <div class="col-lg-4">
              <div class="glass-card p-4 sticky-top" style="top: 100px;">
                <h5 class="fw-bold text-white mb-3 border-bottom border-secondary pb-2"><i class="bi bi-receipt text-rose me-2"></i>Tóm Tắt Đơn Vé</h5>
                <div id="eventOrderSummary" class="mb-4">
                  <div class="text-muted small text-center py-3">Chưa có loại vé nào được chọn.</div>
                </div>
                <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary mb-4">
                  <span class="text-muted">Tổng cộng:</span>
                  <strong class="text-warning fs-4" id="eventTotalAmountDisplay">0 ₫</strong>
                </div>
                <button id="btnSubmitEventBooking" class="btn btn-primary-cine w-100 py-3" disabled onclick="handleEventBooking()">
                  <i class="bi bi-credit-card me-2"></i>Tiếp Tục Thanh Toán Giả Lập
                </button>
                <div class="text-muted small text-center mt-2">
                  <i class="bi bi-shield-lock me-1"></i> Môi trường mô phỏng học tập & kiểm thử
                </div>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        document.getElementById('eventDetailContent').innerHTML = `
          <div class="alert alert-danger glass-card">
            <h5>Không thể tải sự kiện:</h5>
            <p>${err.message}</p>
            <a href="/events.html" class="btn btn-outline-cine btn-sm">Quay lại danh sách</a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
