<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ Đồ Chọn Ghế & Bắp Nước — CineEvent</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts: Be Vietnam Pro & Inter with full Vietnamese support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=4">
  <style>
    .fnb-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .fnb-card:hover {
      border-color: rgba(225, 29, 72, 0.4);
      transform: translateY(-2px);
    }
    .fnb-img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      padding: 0;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/index.html">
        <i class="bi bi-film text-danger fs-3"></i>
        <span>Cine<span class="brand-badge">Event</span></span>
      </a>

      <button class="navbar-toggler border-0 text-white" type="button" data-bs-target="#mainNavbar" data-bs-toggle="collapse">
        <i class="bi bi-list fs-2"></i>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-house-door me-1"></i> Trang Chủ</a></li>
          <li class="nav-item"><a class="nav-link active" href="/movies.html"><i class="bi bi-camera-reels me-1"></i> Phim Chiếu Rạp</a></li>
          <li class="nav-item"><a class="nav-link" href="/events.html"><i class="bi bi-calendar-event me-1"></i> Sự Kiện & Lễ Hội</a></li>
          <li class="nav-item"><a class="nav-link" href="/my-tickets.html"><i class="bi bi-ticket-perforated me-1"></i> Vé Của Tôi</a></li>
        </ul>
        <div id="navbarAuthSection" class="d-flex align-items-center"></div>
      </div>
    </div>
  </nav>

  <!-- Main Booking Area -->
  <main class="container my-5">
    <div id="bookingAreaContent">
      <div class="text-center py-5">
        <div class="spinner-border text-danger" role="status"></div>
        <div class="text-muted mt-2">Đang tải sơ đồ phòng chiếu và tình trạng ghế...</div>
      </div>
    </div>
  </main>

  <footer class="mt-auto py-4 border-top border-secondary" style="background: #070a10;">
    <div class="container text-center text-muted small">
      CineEvent — Hệ Thống Đặt Vé Xem Phim & Sự Kiện | Sinh viên: [HỌ VÀ TÊN] - MSSV: [MSSV] - Lớp: [LỚP]
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=3"></script>
  <script>
    let currentShowtime = null;
    let selectedSeats = new Map(); // seatId -> { id, row, number, type, price }
    let selectedFnb = new Map();   // fnbId -> { id, name, price, quantity }
    let allFnbItems = [];

    function toggleSeat(seatId, row, number, type, seatState, price) {
      if (seatState === 'sold') {
        showToast(`Ghế ${row}${number} đã có người mua trước đó. Vui lòng chọn ghế khác!`, 'warning');
        return;
      }
      if (seatState === 'holding') {
        showToast(`Ghế ${row}${number} hiện đang được giữ tạm bởi một khách hàng khác (~5 phút). Vui lòng chọn ghế khác hoặc chờ giải phóng!`, 'warning');
        return;
      }

      const btn = document.getElementById(`seatBtn_${seatId}`);
      if (!btn) return;

      if (selectedSeats.has(seatId)) {
        selectedSeats.delete(seatId);
        btn.classList.remove('seat-selected');
      } else {
        if (selectedSeats.size >= 8) {
          showToast('Mỗi giao dịch đặt tối đa 8 ghế!', 'warning');
          return;
        }
        selectedSeats.set(seatId, { id: seatId, row, number, type, price });
        btn.classList.add('seat-selected');
      }

      updateSummaryPanel();
    }

    function changeFnbQty(fnbId, delta) {
      const item = allFnbItems.find(f => f.id === fnbId);
      if (!item) return;

      let current = selectedFnb.get(fnbId) || { id: item.id, name: item.name, price: Number(item.price), quantity: 0 };
      let newQty = current.quantity + delta;
      if (newQty < 0) newQty = 0;
      if (newQty > 10) {
        showToast('Tối đa 10 phần cho mỗi loại combo/đồ uống!', 'warning');
        return;
      }

      if (newQty === 0) {
        selectedFnb.delete(fnbId);
      } else {
        current.quantity = newQty;
        selectedFnb.set(fnbId, current);
      }

      const qtyEl = document.getElementById(`fnb_qty_${fnbId}`);
      if (qtyEl) qtyEl.textContent = newQty;

      updateSummaryPanel();
    }

    function updateSummaryPanel() {
      const tagsContainer = document.getElementById('selectedSeatTags');
      const fnbContainer = document.getElementById('selectedFnbSummary');
      const totalAmountEl = document.getElementById('bookingTotalAmount');
      const btnSubmit = document.getElementById('btnSubmitMovieBooking');
      if (!tagsContainer || !totalAmountEl) return;

      let seatsTotal = 0;
      let tagsHtml = '';

      if (selectedSeats.size === 0) {
        tagsContainer.innerHTML = '<span class="text-muted small">Chưa có ghế nào được chọn.</span>';
      } else {
        selectedSeats.forEach(seat => {
          seatsTotal += seat.price;
          const badgeClass = seat.type === 'vip' ? 'bg-warning text-dark' : (seat.type === 'couple' ? 'bg-info text-dark' : 'bg-danger');
          tagsHtml += `
            <span class="badge ${badgeClass} p-2 me-1 mb-1 font-monospace">
              ${seat.row}${seat.number} (${formatVND(seat.price)})
            </span>
          `;
        });
        tagsContainer.innerHTML = tagsHtml;
      }

      let fnbTotal = 0;
      let fnbHtml = '';
      if (selectedFnb.size > 0) {
        selectedFnb.forEach(item => {
          const sub = item.price * item.quantity;
          fnbTotal += sub;
          fnbHtml += `
            <div class="d-flex justify-content-between align-items-center py-1 small border-bottom border-secondary">
              <span class="text-light">${item.name} <strong class="text-warning">x${item.quantity}</strong></span>
              <span>${formatVND(sub)}</span>
            </div>
          `;
        });
      }
      if (fnbContainer) {
        fnbContainer.innerHTML = fnbHtml;
      }

      const grandTotal = seatsTotal + fnbTotal;
      totalAmountEl.textContent = formatVND(grandTotal);

      if (btnSubmit) {
        btnSubmit.disabled = (selectedSeats.size === 0);
      }
    }

    async function handleBookingSubmit() {
      const user = getCurrentUser();
      if (!user) {
        showToast('Vui lòng đăng nhập để tiến hành giữ chỗ và thanh toán!', 'warning');
        const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
        loginModal.show();
        return;
      }

      if (selectedSeats.size === 0) {
        showToast('Vui lòng chọn ít nhất 1 ghế!', 'warning');
        return;
      }

      const seatItems = [];
      selectedSeats.forEach(seat => {
        seatItems.push({
          seat_id: seat.id,
          unit_price: seat.price
        });
      });

      const fnbItems = [];
      selectedFnb.forEach(item => {
        if (item.quantity > 0) {
          fnbItems.push({
            fnb_id: item.id,
            quantity: item.quantity
          });
        }
      });

      const btn = document.getElementById('btnSubmitMovieBooking');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang khóa ghế & tạo đơn...';

      try {
        const res = await apiCall('/bookings', {
          method: 'POST',
          body: {
            booking_type: 'movie',
            showtime_id: currentShowtime.id,
            seat_items: seatItems,
            fnb_items: fnbItems
          }
        });

        showToast('Giữ ghế thành công! Ghế được giữ trong 5 phút. Đang chuyển sang cổng thanh toán...', 'success');
        setTimeout(() => {
          window.location.href = `/payment.html?code=${res.data.bookingCode}`;
        }, 500);
      } catch (err) {
        showToast(err.message, 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-credit-card me-2"></i>Tiếp Tục Thanh Toán';
        // Reload seat map to refresh latest status
        loadSeatMap(currentShowtime.id);
      }
    }

    async function loadSeatMap(showtimeId) {
      try {
        // Fetch showtime seats and F&B list concurrently
        const [res, fnbRes] = await Promise.all([
          apiCall(`/showtimes/${showtimeId}/seats`),
          apiCall('/fnb').catch(() => ({ data: [] }))
        ]);

        const { showtime, seat_matrix, total_seats, available_seats } = res.data;
        currentShowtime = showtime;
        allFnbItems = fnbRes.data || [];
        selectedSeats.clear();
        selectedFnb.clear();

        // Render Seat Matrix
        let matrixHtml = '';
        Object.keys(seat_matrix).sort().forEach(rowKey => {
          const rowSeats = seat_matrix[rowKey];
          let rowHtml = `<div class="seat-row"><span class="row-label">${rowKey}</span>`;

          rowSeats.forEach(s => {
            const state = s.seat_state || (s.is_booked ? 'sold' : 'available');
            const price = s.price || (s.seat_type === 'vip' ? parseFloat(showtime.price_vip) : parseFloat(showtime.price_standard));
            
            let typeClass = 'seat-standard';
            if (s.seat_type === 'vip') typeClass = 'seat-vip';
            if (s.seat_type === 'couple') typeClass = 'seat-couple';

            let stateClass = '';
            if (state === 'sold') stateClass = 'seat-booked';
            else if (state === 'holding') stateClass = 'seat-holding';

            const tooltip = state === 'sold' ? 'Đã bán' : (state === 'holding' ? 'Đang giữ tạm (~5 phút)' : `${s.seat_row}${s.seat_number} (${s.seat_type}) - ${formatVND(price)}`);

            rowHtml += `
              <button type="button" 
                      id="seatBtn_${s.id}" 
                      class="seat-btn ${typeClass} ${stateClass}" 
                      title="Ghế ${tooltip}" 
                      onclick="toggleSeat(${s.id}, '${s.seat_row}', ${s.seat_number}, '${s.seat_type}', '${state}', ${price})">
                ${s.seat_number}
              </button>
            `;
          });

          rowHtml += `<span class="row-label">${rowKey}</span></div>`;
          matrixHtml += rowHtml;
        });

        // Render F&B items
        let fnbCardsHtml = '';
        if (allFnbItems.length > 0) {
          fnbCardsHtml = allFnbItems.map(f => `
            <div class="col-md-6 col-lg-4">
              <div class="fnb-card p-3 h-100 d-flex gap-3 align-items-center">
                <img src="${f.image_url || 'https://images.unsplash.com/photo-1585647347483-22b66260dfff?w=100'}" class="fnb-img" alt="${f.name}">
                <div class="flex-grow-1 min-w-0">
                  <div class="fw-bold text-white text-truncate small mb-1">${f.name}</div>
                  <div class="text-warning small fw-bold mb-2">${formatVND(f.price)}</div>
                  <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary qty-btn text-white" onclick="changeFnbQty(${f.id}, -1)">-</button>
                    <span id="fnb_qty_${f.id}" class="fw-bold text-white px-2">0</span>
                    <button type="button" class="btn btn-sm btn-outline-danger qty-btn text-white" onclick="changeFnbQty(${f.id}, 1)">+</button>
                  </div>
                </div>
              </div>
            </div>
          `).join('');
        } else {
          fnbCardsHtml = '<div class="col-12 text-muted small">Hiện chưa có bắp nước hoặc combo phục vụ cho suất chiếu này.</div>';
        }

        document.getElementById('bookingAreaContent').innerHTML = `
          <!-- Header info -->
          <div class="glass-card p-4 mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
              <div>
                <span class="badge bg-danger mb-1">${showtime.screen_type || '2D Digital'}</span>
                <h4 class="fw-bold text-white mb-1">${showtime.movie_title}</h4>
                <div class="text-muted small">
                  <i class="bi bi-geo-alt text-danger me-1"></i>${showtime.cinema_name} &bull; ${showtime.room_name} &bull; 
                  <i class="bi bi-clock text-warning ms-2 me-1"></i>${formatDateTime(showtime.start_time)}
                </div>
              </div>
              <div class="text-end">
                <div class="text-muted small">Ghế còn trống</div>
                <strong class="text-success fs-5">${available_seats} / ${total_seats}</strong>
              </div>
            </div>
          </div>

          <div class="row g-4">
            <!-- Left: Interactive Seat Map & F&B Selection -->
            <div class="col-lg-8">
              <div class="glass-card p-4 p-md-5 text-center mb-4">
                <!-- Screen indicator -->
                <div class="screen-indicator">
                  <div class="screen-bar"></div>
                  <span class="text-muted small text-uppercase fw-bold letter-spacing-1">MÀN HÌNH CHIẾU</span>
                </div>

                <!-- Seat Grid -->
                <div class="seat-map-container my-4 overflow-auto py-2">
                  ${matrixHtml}
                </div>

                <!-- Legend -->
                <div class="d-flex flex-wrap justify-content-center gap-3 pt-4 border-top border-secondary small text-muted">
                  <div class="d-flex align-items-center gap-2">
                    <span class="seat-btn seat-standard" style="cursor:default;">A</span> Ghế Thường (${formatVND(showtime.price_standard)})
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <span class="seat-btn seat-vip" style="cursor:default;">VIP</span> Ghế VIP (${formatVND(showtime.price_vip)})
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <span class="seat-btn seat-couple" style="cursor:default;">ĐÔI</span> Ghế Đôi
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <span class="seat-btn seat-selected" style="cursor:default;">✓</span> Đang Chọn
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <span class="seat-btn seat-holding" style="cursor:default;">⏱</span> Đang Giữ Tạm
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <span class="seat-btn seat-booked" style="cursor:default;">X</span> Đã Bán
                  </div>
                </div>
              </div>

              <!-- F&B Selection Section -->
              <div class="glass-card p-4">
                <h5 class="fw-bold text-white mb-3">
                  <i class="bi bi-cup-straw text-danger me-2"></i>Chọn Thêm Bắp Rang & Thức Uống (F&B)
                </h5>
                <p class="text-muted small mb-3">Tận hưởng trọn vẹn suất chiếu cùng các combo bắp nước hảo hạng ưu đãi độc quyền:</p>
                <div class="row g-3">
                  ${fnbCardsHtml}
                </div>
              </div>
            </div>

            <!-- Right: Order Panel -->
            <div class="col-lg-4">
              <div class="glass-card p-4 sticky-top" style="top: 100px;">
                <h5 class="fw-bold text-white mb-3 border-bottom border-secondary pb-2">
                  <i class="bi bi-ticket-detailed text-danger me-2"></i>Thông Tin Đặt Chỗ
                </h5>

                <div class="d-flex gap-3 align-items-center mb-3">
                  <img src="${showtime.poster_url}" style="width: 65px; height: 95px; object-fit: cover; border-radius: 8px;" alt="${showtime.movie_title}">
                  <div>
                    <h6 class="fw-bold text-white mb-1 text-truncate" style="max-width: 200px;">${showtime.movie_title}</h6>
                    <div class="text-muted small"><i class="bi bi-clock me-1"></i>${showtime.duration} phút</div>
                    <div class="text-warning small mt-1">${showtime.room_name}</div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="text-muted small mb-1 d-block fw-bold">Ghế đã chọn:</label>
                  <div id="selectedSeatTags" class="d-flex flex-wrap">
                    <span class="text-muted small">Chưa có ghế nào được chọn.</span>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="text-muted small mb-1 d-block fw-bold">Bắp nước & Combo:</label>
                  <div id="selectedFnbSummary">
                    <span class="text-muted small">Chưa chọn bắp nước.</span>
                  </div>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary mb-3">
                  <span class="text-muted">Tổng số tiền:</span>
                  <strong class="text-warning fs-4" id="bookingTotalAmount">0 ₫</strong>
                </div>

                <button id="btnSubmitMovieBooking" class="btn btn-primary-cine w-100 py-3" disabled onclick="handleBookingSubmit()">
                  <i class="bi bi-credit-card me-2"></i>Tiếp Tục Thanh Toán
                </button>
                <div class="text-muted small text-center mt-2">
                  <i class="bi bi-stopwatch text-warning me-1"></i> Ghế được giữ tạm trong <strong>5 phút</strong> để hoàn tất thanh toán
                </div>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        document.getElementById('bookingAreaContent').innerHTML = `
          <div class="alert alert-danger glass-card">
            <h5>Không thể tải sơ đồ ghế:</h5>
            <p>${err.message}</p>
            <a href="/movies.html" class="btn btn-outline-cine btn-sm">Quay lại danh sách phim</a>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const showtimeId = urlParams.get('showtime_id') || '1';
      loadSeatMap(showtimeId);
    });
  </script>
</body>
</html>
