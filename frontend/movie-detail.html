<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Phim & Suất Chiếu — CineEvent</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/index.html">
        <i class="bi bi-film text-danger fs-3"></i>
        <span>Cine<span class="brand-badge">Event</span></span>
      </a>

      <button class="navbar-toggler border-0 text-white" type="button" data-bs-target="#mainNavbar" data-bs-toggle="collapse">
        <i class="bi bi-list fs-2"></i>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-house-door me-1"></i> Trang Chủ</a></li>
          <li class="nav-item"><a class="nav-link active" href="/movies.html"><i class="bi bi-camera-reels me-1"></i> Phim Chiếu Rạp</a></li>
          <li class="nav-item"><a class="nav-link" href="/events.html"><i class="bi bi-calendar-event me-1"></i> Sự Kiện & Lễ Hội</a></li>
          <li class="nav-item"><a class="nav-link" href="/my-tickets.html"><i class="bi bi-ticket-perforated me-1"></i> Vé Của Tôi</a></li>
        </ul>
        <div id="navbarAuthSection" class="d-flex align-items-center"></div>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container my-5">
    <div id="movieDetailContent">
      <div class="text-center py-5">
        <div class="spinner-border text-danger" role="status"></div>
        <div class="text-muted mt-2">Đang tải thông tin phim...</div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto py-4 border-top border-secondary" style="background: #070a10;">
    <div class="container text-center text-muted small">
      CineEvent — Hệ Thống Đặt Vé Xem Phim & Sự Kiện | Sinh viên: [HỌ VÀ TÊN] - MSSV: [MSSV] - Lớp: [LỚP]
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const movieId = urlParams.get('id') || '1';

      try {
        const res = await apiCall(`/movies/${movieId}`);
        const movie = res.data;

        // Group showtimes by cinema and room
        const cinemaGroups = {};
        if (movie.showtimes && movie.showtimes.length > 0) {
          movie.showtimes.forEach(st => {
            const cinemaKey = st.cinema_name || 'Rạp Khác';
            if (!cinemaGroups[cinemaKey]) {
              cinemaGroups[cinemaKey] = {
                name: st.cinema_name,
                address: st.cinema_address,
                showtimes: []
              };
            }
            cinemaGroups[cinemaKey].showtimes.push(st);
          });
        }

        let showtimeHtml = '';
        if (Object.keys(cinemaGroups).length > 0) {
          showtimeHtml = Object.values(cinemaGroups).map(c => `
            <div class="glass-card p-4 mb-3">
              <div class="d-flex align-items-center gap-2 mb-3">
                <i class="bi bi-geo-alt-fill text-danger fs-5"></i>
                <div>
                  <h6 class="fw-bold text-white mb-0">${c.name}</h6>
                  <span class="text-muted small">${c.address || ''}</span>
                </div>
              </div>
              <div class="d-flex flex-wrap gap-3">
                ${c.showtimes.map(st => {
                  const time = new Date(st.start_time).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                  return `
                    <a href="/booking.html?showtime_id=${st.id}" class="btn btn-outline-cine p-2 text-center" style="min-width: 110px;">
                      <div class="fw-bold fs-5 text-white">${time}</div>
                      <div class="small text-warning">${formatVND(st.price_standard)}</div>
                      <span class="badge bg-secondary" style="font-size: 0.65rem;">${st.room_name}</span>
                    </a>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('');
        } else {
          showtimeHtml = '<div class="glass-card p-4 text-center text-muted">Hiện chưa có lịch chiếu cho phim này. Vui lòng quay lại sau!</div>';
        }

        document.getElementById('movieDetailContent').innerHTML = `
          <!-- Header Banner -->
          <div class="glass-card p-4 p-md-5 mb-5 position-relative overflow-hidden">
            <div class="row g-4 align-items-center">
              <div class="col-md-4 col-lg-3 text-center">
                <div class="poster-wrapper rounded-3 shadow-lg" style="max-width: 260px; margin: 0 auto;">
                  <span class="age-badge">${movie.age_rating || 'P'}</span>
                  <img src="${movie.poster_url}" class="poster-img" alt="${movie.title}">
                </div>
              </div>
              <div class="col-md-8 col-lg-9">
                <div class="d-flex flex-wrap gap-2 mb-2">
                  <span class="badge bg-danger">${movie.genre_name || 'Điện ảnh'}</span>
                  <span class="badge bg-dark border border-secondary">${movie.age_rating || 'P'} - Khuyên dùng</span>
                  <span class="badge bg-secondary"><i class="bi bi-clock me-1"></i>${movie.duration} phút</span>
                </div>
                <h1 class="display-6 fw-bold text-white mb-3">${movie.title}</h1>
                <p class="text-light lead fs-6 mb-4">${movie.description || 'Chưa có tóm tắt nội dung.'}</p>

                <div class="row g-3 small text-muted mb-4 border-top border-secondary pt-3">
                  <div class="col-sm-6">
                    <div><strong class="text-white">Đạo diễn:</strong> ${movie.director || 'Đang cập nhật'}</div>
                    <div class="mt-1"><strong class="text-white">Khởi chiếu:</strong> ${formatDateOnly(movie.release_date)}</div>
                  </div>
                  <div class="col-sm-6">
                    <div><strong class="text-white">Diễn viên:</strong> ${movie.cast || 'Đang cập nhật'}</div>
                    <div class="mt-1"><strong class="text-white">Ngôn ngữ:</strong> Tiếng Việt / Phụ đề</div>
                  </div>
                </div>

                <a href="#showtimesSection" class="btn btn-primary-cine px-4 py-2">
                  <i class="bi bi-ticket-fill me-2"></i>Chọn Suất Chiếu
                </a>
              </div>
            </div>
          </div>

          <!-- Showtimes Section -->
          <div id="showtimesSection" class="mt-5">
            <div class="d-flex align-items-center gap-2 mb-4">
              <i class="bi bi-calendar-check text-danger fs-3"></i>
              <h3 class="fw-bold text-white mb-0">Lịch Chiếu & Đặt Ghế</h3>
            </div>
            ${showtimeHtml}
          </div>
        `;
      } catch (err) {
        document.getElementById('movieDetailContent').innerHTML = `
          <div class="alert alert-danger glass-card">
            <h5>Không thể tải phim:</h5>
            <p>${err.message}</p>
            <a href="/movies.html" class="btn btn-outline-cine btn-sm">Quay lại danh sách</a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
